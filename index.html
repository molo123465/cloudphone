<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudPhone - Android en la Nube</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
    h1 { font-size: 1.6rem; color: #38bdf8; margin-bottom: 5px; }
    p.sub { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }
    .mockup { position: relative; width: 300px; height: 600px; background: #000; border: 8px solid #1e293b; border-radius: 36px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    iframe { width: 100%; height: 100%; border: none; }
    .timer { position: absolute; top: 12px; right: 12px; background: #ef4444; font-size: 0.75rem; font-weight: bold; padding: 4px 8px; border-radius: 12px; z-index: 10; }
    .paywall { display: none; position: absolute; inset: 0; background: rgba(11, 15, 25, 0.95); flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; z-index: 20; }
    .paywall.active { display: flex; }
    .btn-buy { background: #10b981; color: #fff; padding: 12px 20px; border-radius: 8px; font-weight: bold; text-decoration: none; margin-top: 15px; display: inline-block; }
  </style>
</head>
<body>
  <h1>CloudPhone 24/7</h1>
  <p class="sub">Prueba gratuita activa de 5 minutos</p>
  <div class="mockup">
    <div id="reloj" class="timer">05:00</div>
    <iframe id="pantalla" src="about:blank"></iframe>
    <div id="bloqueo" class="paywall">
      <h3>¡Prueba Terminada!</h3>
      <p style="margin-top: 10px; font-size: 0.8rem; color: #94a3b8;">Tu sesión de 5 minutos ha expirado. Compra acceso 24/7 sin límites.</p>
      <a href="https://t.me/TuUsuarioDeTelegram" class="btn-buy" target="_blank">Comprar por 5€ / mes</a>
    </div>
  </div>

  <script>
    let tiempo = 300;
    const reloj = document.getElementById('reloj');
    const bloqueo = document.getElementById('bloqueo');
    const pantalla = document.getElementById('pantalla');

    const cuentaAtras = setInterval(() => {
      tiempo--;
      let m = Math.floor(tiempo / 60).toString().padStart(2, '0');
      let s = (tiempo % 60).toString().padStart(2, '0');
      reloj.textContent = `${m}:${s}`;
      if (tiempo <= 0) {
        clearInterval(cuentaAtras);
        reloj.style.display = 'none';
        pantalla.src = 'about:blank';
        bloqueo.classList.add('active');
      }
    }, 1000);
  </script>
</body>
</html>
